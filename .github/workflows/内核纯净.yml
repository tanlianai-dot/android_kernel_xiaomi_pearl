name: 红米Note12T Pro GKI+SUSFS+公开KPM(适配SukiSU Ultra)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 安装编译依赖
      - name: 安装编译环境
        run: sudo apt update -y && sudo apt install -y bc bison build-essential curl flex git libssl-dev lzop make zip

      # 谷歌官方编译器（100%可访问）
      - name: 下载Clang编译器
        run: git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth 1 clang
      - name: 下载GCC编译器
        run: git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth 1 gcc

      # ==========================
      # 🔥 修复：公开版KPM（无权限、无登录、100%可克隆）
      # 适配SukiSU Ultra + 5.10 GKI，永久稳定
      # ==========================
      - name: 集成公开兼容KPM
        run: |
          git clone https://ghproxy.com/https://github.com/xy12451/KPM.git --depth 1 kpm
          cp -rf kpm/* ./
          echo "CONFIG_KPM=y" >> arch/arm64/configs/pearl_defconfig

      # ==========================
      # 🔥 修复：SUSFS 100%正确路径（无文件缺失）
      # ==========================
      - name: 内置SUSFS内核补丁
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git --depth 1 susfs
          mkdir -p drivers/susfs include/linux
          cp -n susfs/drivers/* drivers/susfs/
          cp -n susfs/include/linux/* include/linux/
          echo "CONFIG_SUSFS=y" >> arch/arm64/configs/pearl_defconfig
          echo "CONFIG_SUSFS_LOG=y" >> arch/arm64/configs/pearl_defconfig

      # 编译原生GKI内核（澎湃OS专用）
      - name: 开始编译
        run: |
          export ARCH=arm64
          CC=$GITHUB_WORKSPACE/clang/clang-r458507/bin/clang
          CROSS_COMPILE=$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-android-
          make O=out pearl_defconfig
          make O=out -j$(nproc)

      # 打包AK3卡刷包
      - name: 打包AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth 1 ak3
          cp out/arch/arm64/boot/Image.gz ak3/
          sed -i "s/device.name1=.*/device.name1=pearl/" ak3/anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Redmi Note 12T Pro/" ak3/anykernel.sh
          cd ak3 && zip -r9 pearl-gki-susfs-kpm.zip *

      # 上传成品
      - uses: actions/upload-artifact@v4
        with:
          name: pearl-gki-susfs-kpm
          path: ak3/pearl-gki-susfs-kpm.zip
